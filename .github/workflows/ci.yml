name: CI

on:
  push:
    branches: [ main, "doc/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting (Black)
        run: |
          black --check src scripts tests

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 src scripts tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      - name: Run pytest (Unit tests & Schema validation)
        run: |
          pytest
