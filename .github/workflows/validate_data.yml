name: CI Data & Code Validation

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-json-schemas:
    name: Validate Dataset Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate JSON Data Files
        run: |
          python -c "
          import json, glob, sys
          from jsonschema import validate, ValidationError

          schema_path = 'data/schemas/dictionary_entry.schema.json'
          try:
              with open(schema_path, 'r', encoding='utf-8') as sf:
                  schema = json.load(sf)
          except Exception as e:
              print(f'::error::Failed to load schema file at {schema_path}: {e}')
              sys.exit(1)

          json_files = glob.glob('data/dictionary/*.json')
          failed = False

          for filepath in json_files:
              try:
                  with open(filepath, 'r', encoding='utf-8') as jf:
                      data = json.load(jf)
                      # If file contains an array of items, validate each
                      if isinstance(data, list):
                          for idx, item in enumerate(data):
                              validate(instance=item, schema=schema)
                      else:
                          validate(instance=data, schema=schema)
                  print(f'✅ VALIDATED: {filepath}')
              except ValidationError as ve:
                  print(f'::error file={filepath}::JSON Schema Validation Error: {ve.message}')
                  failed = True
              except Exception as e:
                  print(f'::error file={filepath}::Failed to parse JSON file: {e}')
                  failed = True

          if failed:
              sys.exit(1)
          "

  pytest-and-lint:
    name: Run Python Tests & Tokenizer Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Package & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest src/tests/
